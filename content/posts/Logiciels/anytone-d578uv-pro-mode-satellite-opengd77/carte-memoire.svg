<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="672" viewBox="0 0 1200 672" role="img" aria-labelledby="ttl dsc"><title id="ttl">Cartographie de la mémoire</title><desc id="dsc">Premier mébioctet presque rempli, flash haute non validée libre, 42 Kio en fin de flash réservés, 96 Kio de SRAM et NAND externe 256 Mio.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 11 4 L 0 8 z" fill="#7191a8"/></marker></defs><rect width="1200" height="672" fill="#fff"/><text x="40" y="54" fill="#142b43" font-size="30" font-weight="700" text-anchor="start">Mémoire du GD32F303VKT6 : état de l’enquête</text><text x="40" y="87" fill="#4c6175" font-size="17" font-weight="400" text-anchor="start">Capacité physique et espace utilisable sont différents</text><text x="40" y="134" fill="#142b43" font-size="21" font-weight="650" text-anchor="start">Flash interne : 3 Mio, de 0x08000000 à 0x082FFFFF</text><rect x="40" y="153" width="22" height="52" rx="2" fill="#fceae8" stroke="#cb8d85" stroke-width="2"/><rect x="62" y="153" width="348" height="52" rx="2" fill="#e8f2fb" stroke="#7cadd3" stroke-width="2"/><rect x="410" y="153" width="4" height="52" rx="2" fill="#fff5dd" stroke="#d6ad5c" stroke-width="2"/><rect x="414" y="153" width="730" height="52" rx="2" fill="#eff3f6" stroke="#aab8c5" stroke-width="2"/><rect x="1144" y="153" width="16" height="52" rx="2" fill="#fceae8" stroke="#cb8d85" stroke-width="2"/><text x="42" y="226" fill="#4c6175" font-size="16" font-weight="500" text-anchor="start">Chargeur / bas de Flash : zone réservée</text><text x="350" y="226" fill="#172a3d" font-size="16" font-weight="600" text-anchor="start">Image PRO V1.20 : 1 020 096 o</text><text x="727" y="226" fill="#172a3d" font-size="16" font-weight="600" text-anchor="start">Flash haute : contenu non cartographié</text><text x="40" y="280" fill="#142b43" font-size="21" font-weight="650" text-anchor="start">Zoom : premier Mio (0x08000000 à 0x080FFFFF)</text><rect x="40" y="298" width="28" height="52" rx="2" fill="#fceae8" stroke="#cb8d85" stroke-width="2"/><rect x="68" y="298" width="1082" height="52" rx="2" fill="#e8f2fb" stroke="#7cadd3" stroke-width="2"/><rect x="1150" y="298" width="10" height="52" rx="2" fill="#fff5dd" stroke="#d6ad5c" stroke-width="2"/><text x="40" y="377" fill="#4c6175" font-size="17" font-weight="500" text-anchor="start">24 Kio en début de Flash : ne pas écrire</text><text x="490" y="377" fill="#172a3d" font-size="17" font-weight="600" text-anchor="start">Programme du PRO : fin à 0x080FF0C0</text><text x="675" y="409" fill="#8c641f" font-size="17" font-weight="600" text-anchor="start">Marge : 3 904 octets (non vérifiée libre)</text><text x="40" y="459" fill="#142b43" font-size="20" font-weight="650" text-anchor="start">SRAM : 96 Kio</text><rect x="40" y="472" width="1120" height="38" rx="4" fill="#e7f5ee" stroke="#78b59a" stroke-width="2"/><text x="48" y="499" fill="#172a3d" font-size="18" font-weight="500" text-anchor="start">Tâches radio + piles + données : RAM libre NON mesurée</text><text x="40" y="552" fill="#142b43" font-size="20" font-weight="650" text-anchor="start">NAND externe : 256 Mio (2 Gbit, SPI)</text><rect x="40" y="565" width="1120" height="40" rx="4" fill="#eff3f6" stroke="#aab8c5" stroke-width="2"/><text x="48" y="592" fill="#172a3d" font-size="18" font-weight="500" text-anchor="start">Stockage à cartographier ; ne permet pas d’exécuter directement le code PLAN13</text><text x="40" y="639" fill="#9a5049" font-size="17" font-weight="650" text-anchor="start">Zone haute 0x082F5800–0x082FFFFF : 42 Kio gérés par AnyTone, à exclure.</text></svg>