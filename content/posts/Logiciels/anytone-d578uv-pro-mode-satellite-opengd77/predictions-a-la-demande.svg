<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="558" viewBox="0 0 1200 558" role="img" aria-labelledby="ttl dsc"><title id="ttl">Comparaison des prédictions</title><desc id="dsc">Avec un satellite actif et deux emplacements de passage, la BSS mesurée descend de 11972 à 288 octets, mais ne compte pas les autres composants.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 11 4 L 0 8 z" fill="#7191a8"/></marker></defs><rect width="1200" height="558" fill="#fff"/><text x="40" y="52" fill="#142b43" font-size="30" font-weight="700" text-anchor="start">Passages : calcul global ou seulement à la demande ?</text><text x="40" y="83" fill="#4c6175" font-size="17" font-weight="400" text-anchor="start">Même moteur PLAN13 ; seul le stockage et l’ordonnancement changent</text><rect x="35" y="109" width="530" height="340" rx="16" fill="#eff3f6" stroke="#aab8c5" stroke-width="2"/><text x="299" y="155" fill="#142b43" font-size="25" font-weight="700" text-anchor="middle">OpenGD77 original</text><rect x="78" y="186" width="445" height="81" rx="14" fill="#e8f2fb" stroke="#7cadd3" stroke-width="2"/><text x="300.5" y="218.5" fill="#172a3d" font-size="20" font-weight="600" text-anchor="middle">25 satellites × 15 passages</text><text x="300.5" y="244.5" fill="#172a3d" font-size="20" font-weight="400" text-anchor="middle">Horizon de recherche : 24 h</text><line x1="300" y1="271" x2="300" y2="311" stroke="#7191a8" stroke-width="3" marker-end="url(#arrow)"/><rect x="78" y="323" width="445" height="76" rx="14" fill="#fceae8" stroke="#cb8d85" stroke-width="2"/><text x="300.5" y="366.0" fill="#172a3d" font-size="22" font-weight="600" text-anchor="middle">BSS moteur : 11 972 octets</text><rect x="635" y="109" width="530" height="340" rx="16" fill="#e7f5ee" stroke="#78b59a" stroke-width="2"/><text x="901" y="155" fill="#142b43" font-size="25" font-weight="700" text-anchor="middle">Portage D578 proposé</text><rect x="681" y="186" width="441" height="81" rx="14" fill="#e8f2fb" stroke="#7cadd3" stroke-width="2"/><text x="901.5" y="218.5" fill="#172a3d" font-size="19" font-weight="600" text-anchor="middle">25 configurations conservées</text><text x="901.5" y="244.5" fill="#172a3d" font-size="19" font-weight="400" text-anchor="middle">1 satellite chargé, horizon 6 h</text><line x1="900" y1="271" x2="900" y2="311" stroke="#7191a8" stroke-width="3" marker-end="url(#arrow)"/><rect x="681" y="323" width="441" height="76" rx="14" fill="#e7f5ee" stroke="#78b59a" stroke-width="2"/><text x="901.5" y="366.0" fill="#172a3d" font-size="22" font-weight="600" text-anchor="middle">BSS moteur : 288 octets</text><text x="50" y="497" fill="#4c6175" font-size="17" font-weight="500" text-anchor="start">Le catalogue persistant, la pile, l’interface et l’ordonnanceur ne sont pas compris dans les 288 octets.</text><text x="50" y="531" fill="#4c6175" font-size="17" font-weight="500" text-anchor="start">30 scénarios AOS/LOS : résultats identiques à OpenGD77 original après correction de la reprise.</text></svg>