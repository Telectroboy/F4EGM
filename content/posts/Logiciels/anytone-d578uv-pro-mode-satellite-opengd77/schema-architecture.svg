<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="602" viewBox="0 0 1200 602" role="img" aria-labelledby="ttl dsc"><title id="ttl">Architecture cible</title><desc id="dsc">Les configurations, le GPS et l’heure alimentent PLAN13. Trois adaptateurs vers le D578 restent à réaliser : interface, fréquence et APRS.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 11 4 L 0 8 z" fill="#7191a8"/></marker></defs><rect width="1200" height="602" fill="#fff"/><text x="40" y="52" fill="#142b43" font-size="30" font-weight="700" text-anchor="start">Architecture cible du mode Satellite</text><text x="40" y="84" fill="#4c6175" font-size="17" font-weight="400" text-anchor="start">Blocs réutilisés et liaisons encore à développer</text><rect x="35" y="117" width="330" height="110" rx="14" fill="#e8f2fb" stroke="#7cadd3" stroke-width="2"/><text x="200.0" y="164.0" fill="#172a3d" font-size="19" font-weight="600" text-anchor="middle">25 fiches satellites</text><text x="200.0" y="190.0" fill="#172a3d" font-size="19" font-weight="400" text-anchor="middle">TLE + modes FM / APRS / balise</text><rect x="435" y="117" width="330" height="110" rx="14" fill="#eff3f6" stroke="#aab8c5" stroke-width="2"/><text x="600.0" y="164.0" fill="#172a3d" font-size="19" font-weight="600" text-anchor="middle">GPS + RTC du D578</text><text x="600.0" y="190.0" fill="#172a3d" font-size="19" font-weight="400" text-anchor="middle">Position et heure UTC</text><rect x="835" y="117" width="330" height="110" rx="14" fill="#e8f2fb" stroke="#7cadd3" stroke-width="2"/><text x="1000.0" y="164.0" fill="#172a3d" font-size="19" font-weight="600" text-anchor="middle">Paramètres OpenGD77</text><text x="1000.0" y="190.0" fill="#172a3d" font-size="19" font-weight="400" text-anchor="middle">Fréquences / CTCSS / APRS</text><line x1="201" y1="228" x2="390" y2="266" stroke="#7191a8" stroke-width="3" marker-end="url(#arrow)"/><line x1="600" y1="228" x2="600" y2="266" stroke="#7191a8" stroke-width="3" marker-end="url(#arrow)"/><line x1="1000" y1="228" x2="811" y2="266" stroke="#7191a8" stroke-width="3" marker-end="url(#arrow)"/><rect x="205" y="274" width="790" height="108" rx="14" fill="#e7f5ee" stroke="#78b59a" stroke-width="2"/><text x="600.0" y="320.0" fill="#172a3d" font-size="21" font-weight="600" text-anchor="middle">PLAN13 OpenGD77 + ordonnanceur à la demande</text><text x="600.0" y="346.0" fill="#172a3d" font-size="21" font-weight="400" text-anchor="middle">1 satellite actif · horizon 6 heures · calcul fractionné</text><line x1="395" y1="383" x2="207" y2="431" stroke="#7191a8" stroke-width="3" marker-end="url(#arrow)"/><line x1="600" y1="383" x2="600" y2="431" stroke="#7191a8" stroke-width="3" marker-end="url(#arrow)"/><line x1="805" y1="383" x2="995" y2="431" stroke="#7191a8" stroke-width="3" marker-end="url(#arrow)"/><rect x="35" y="441" width="330" height="95" rx="14" fill="#fff5dd" stroke="#d6ad5c" stroke-width="2"/><text x="200.0" y="480.5" fill="#172a3d" font-size="19" font-weight="600" text-anchor="middle">IHM et touches D578</text><text x="200.0" y="506.5" fill="#172a3d" font-size="19" font-weight="400" text-anchor="middle">À adapter</text><rect x="435" y="441" width="330" height="95" rx="14" fill="#fff5dd" stroke="#d6ad5c" stroke-width="2"/><text x="600.0" y="480.5" fill="#172a3d" font-size="19" font-weight="600" text-anchor="middle">VFO / Doppler / PTT</text><text x="600.0" y="506.5" fill="#172a3d" font-size="19" font-weight="400" text-anchor="middle">À valider sur poste</text><rect x="835" y="441" width="330" height="95" rx="14" fill="#fff5dd" stroke="#d6ad5c" stroke-width="2"/><text x="1000.0" y="480.5" fill="#172a3d" font-size="19" font-weight="600" text-anchor="middle">Émission APRS</text><text x="1000.0" y="506.5" fill="#172a3d" font-size="19" font-weight="400" text-anchor="middle">À raccorder au D578</text><text x="36" y="574" fill="#4c6175" font-size="16" font-weight="400" text-anchor="start">Vert : code PLAN13 testé en simulation. Jaune : interfaces non intégrées au firmware constructeur.</text></svg>