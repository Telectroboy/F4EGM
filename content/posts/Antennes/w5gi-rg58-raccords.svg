<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540" role="img" aria-labelledby="title desc">
  <title id="title">Raccordements d'une section RG58 dans la W5GI</title>
  <desc id="desc">Côté centre seule l'âme du RG58 est raccordée, côté extérieur l'âme et la tresse sont reliées ensemble au fil.</desc>
  <rect width="1400" height="540" fill="white"/>
  <text x="700" y="55" font-family="sans-serif" font-size="36" font-weight="700" text-anchor="middle" fill="#111">Raccordement d'une section de RG58</text>

  <g stroke="#111" fill="none" stroke-linecap="round">
    <line x1="100" y1="230" x2="330" y2="230" stroke-width="5"/>
    <line x1="330" y1="230" x2="1060" y2="230" stroke-width="5"/>
    <line x1="1060" y1="230" x2="1300" y2="230" stroke-width="5"/>
    <rect x="350" y="190" width="690" height="80" rx="20" stroke-width="4"/>
    <line x1="360" y1="195" x2="360" y2="120" stroke-width="4"/>
    <line x1="360" y1="120" x2="430" y2="120" stroke-width="4"/>
    <line x1="1030" y1="195" x2="1060" y2="230" stroke-width="4"/>
  </g>

  <g fill="#111" font-family="sans-serif" text-anchor="middle">
    <text x="210" y="195" font-size="28">Fil intérieur 5,23 m</text>
    <text x="700" y="330" font-size="30">RG58, longueur physique 5,08 m</text>
    <text x="1180" y="195" font-size="28">Fil extérieur 5,13 m</text>
    <text x="410" y="100" font-size="26">Tresse isolée, non connectée</text>
    <text x="1110" y="295" font-size="26">Âme + tresse reliées ensemble</text>
    <text x="270" y="420" font-size="28" font-weight="700">Côté centre</text>
    <text x="1130" y="420" font-size="28" font-weight="700">Côté extérieur</text>
  </g>

  <g stroke="#111" fill="#111">
    <circle cx="330" cy="230" r="7"/>
    <circle cx="1060" cy="230" r="7"/>
  </g>
</svg>
