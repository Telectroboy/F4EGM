  <text fill="#132338" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="bold" text-anchor="start" x="85" y="293">VOLANT MOTEUR</text>
  <text fill="#536477" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" text-anchor="start" x="85" y="341">Une cible tourne avec le</text>
