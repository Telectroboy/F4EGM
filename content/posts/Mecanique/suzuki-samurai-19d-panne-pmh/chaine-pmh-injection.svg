  <text fill="#132338" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="bold" text-anchor="start" x="326" y="552">Le calculateur peut ne pas autoriser le débit d’injection.</text>
  <text fill="#536477" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="326" y="589">Interprétation compatible avec la panne constatée, sans mesure du signal à l’oscilloscope.</text>
