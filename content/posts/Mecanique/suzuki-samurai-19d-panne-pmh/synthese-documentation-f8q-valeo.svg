  <text fill="#132338" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="95" y="551">d’injection.</text>
  <rect fill="#0d829a" height="36" rx="10" ry="10" stroke="none" stroke-width="1" width="200" x="719" y="176"/>
