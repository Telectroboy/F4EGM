  <text fill="#132338" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="bold" text-anchor="start" x="88" y="253">NT 3163A · moteur F8Q 622</text>
  <text fill="#536477" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="88" y="292">Injection Lucas EPIC · document comparatif</text>
