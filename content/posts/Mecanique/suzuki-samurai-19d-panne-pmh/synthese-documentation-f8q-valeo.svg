  <text fill="#0d829a" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="95" y="357">Page 13-2</text>
  <text fill="#132338" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="95" y="385">Capteur de régime : environ 650 Ω.</text>
  <text fill="#0d829a" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="95" y="427">Pages 13-7 et 13-8</text>
  <text fill="#132338" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="95" y="455">Capteur PMH repéré séparément de la pompe.</text>
  <text fill="#0d829a" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="start" x="95" y="497">Page 13-10</text>
