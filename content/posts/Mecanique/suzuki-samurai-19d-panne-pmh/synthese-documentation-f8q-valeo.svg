  <rect fill="#fff4e4" height="49" rx="10" ry="10" stroke="none" stroke-width="1" width="1235" x="62" y="688"/>
  <text fill="#132338" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="82" y="719">650 Ω et 700 Ω : références documentaires différentes, pas deux mesures réalisées sur mon véhicule.</text>
