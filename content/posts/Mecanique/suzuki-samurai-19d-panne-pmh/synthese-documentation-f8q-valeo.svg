  <text fill="#132338" font-family="DejaVu Sans,Arial,sans-serif" font-size="37" font-weight="bold" text-anchor="start" x="60" y="73">Documentation technique : ce que disent les sources</text>
  <text fill="#536477" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" text-anchor="start" x="60" y="108">Synthèses originales des documents, pas de reproductions des planches constructeur</text>
  <rect fill="#f3f6f8" height="515" rx="21" ry="21" stroke="#dce4e9" stroke-width="2" width="604" x="60" y="149"/>
  <rect fill="#eef7f9" height="515" rx="21" ry="21" stroke="#dce4e9" stroke-width="2" width="605" x="695" y="149"/>
